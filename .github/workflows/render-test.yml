name: Render scene

# Manual trigger only: no schedule, no secrets, no posting.
# Pick a scene from the list, then preview (a few PNG stills) or full (the mp4).
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Which scene to render"
        type: choice
        options:
          - scene_04_landing
          - scene_03_ion_transfer
          - mission_render2d
          - tortoise_hare
        default: scene_04_landing
      mode:
        description: "preview = PNG stills (a minute or two), full = the mp4"
        type: choice
        options:
          - preview
          - full
        default: preview
      fps:
        description: "Frame rate for full mode (15 = quick test, 30 = final)"
        type: choice
        options:
          - "15"
          - "30"
        default: "15"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Render
        shell: bash
        env:
          SCENE: ${{ inputs.scene }}
          MODE: ${{ inputs.mode }}
          FPS: ${{ inputs.fps }}
        run: |
          case "$SCENE" in
            mission_render2d)      SCRIPT=render2d.py;               STILLS="3,12,19,26,31,38,50" ;;
            scene_03_ion_transfer) SCRIPT=scene_03_ion_transfer.py;  STILLS="1,3,6,12,20,26,31" ;;
            scene_04_landing)      SCRIPT=scene_04_landing.py;       STILLS="1,8,13,20,30,44,52" ;;
            tortoise_hare)         SCRIPT=render_tortoise_hare.py;   STILLS="3,9,18,27,34" ;;
            *) echo "::error::unknown scene $SCENE"; exit 1 ;;
          esac
          [ -f "$SCRIPT" ] || { echo "::error::$SCRIPT is not in the repo yet - upload it first"; exit 1; }
          mkdir -p out
          if [ "$MODE" = "preview" ]; then
            python "$SCRIPT" --out "out/$SCENE.mp4" --still "$STILLS" | tee render.log
          else
            python "$SCRIPT" --out "out/$SCENE.mp4" --fps "$FPS" | tee render.log
          fi
          {
            echo "### $SCENE ($MODE)"
            echo '```'
            tail -12 render.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.scene }}-${{ inputs.mode }}
          path: out/
          if-no-files-found: error
          retention-days: 3
